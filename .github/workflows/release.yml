name: Release Alwide

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    strategy:
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-22.04
            linuxdeploy_arch: x86_64
            deb_arch: amd64
            rpm_arch: x86_64
          - arch: arm64
            os: ubuntu-24.04-arm
            linuxdeploy_arch: aarch64
            deb_arch: arm64
            rpm_arch: aarch64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libncursesw5-dev clang || sudo apt-get install -y libncurses-dev clang

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            lib/**/target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Install tree-sitter CLI
        run: |
          if ! command -v tree-sitter &> /dev/null; then
            cargo install tree-sitter-cli --version 0.24.7
          fi

      - name: Build tree-sitter library
        run: sudo make -C lib/tree-sitter/ install

      - name: Build Alwide (Release)
        run: make release -j$(nproc)

      - name: Install AppImage dependencies
        run: |
          sudo apt-get install -y libfuse2
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.linuxdeploy_arch }}.AppImage
          chmod +x linuxdeploy-${{ matrix.linuxdeploy_arch }}.AppImage

      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/share/alwide
          cp -r assets/* AppDir/usr/share/alwide/
          ./linuxdeploy-${{ matrix.linuxdeploy_arch }}.AppImage --appdir AppDir -e al -i alwide.png -d alwide.desktop --output appimage
          mv Alwide-${{ matrix.linuxdeploy_arch }}.AppImage alwide-${{ matrix.arch }}.AppImage

      - name: Install FPM
        run: |
          sudo apt-get install -y ruby ruby-dev rubygems build-essential rpm
          sudo gem install --no-document fpm

      - name: Build .deb and .rpm packages
        run: |
          mkdir -p build_root
          make DESTDIR=./build_root PREFIX=/usr install
          VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//' | sed 's/^\.//')
          fpm -s dir -t deb -n alwide -v "$VERSION" -a ${{ matrix.deb_arch }} -p alwide-linux-${{ matrix.deb_arch }}.deb -C build_root usr/bin usr/share
          fpm -s dir -t rpm -n alwide -v "$VERSION" -a ${{ matrix.rpm_arch }} -p alwide-linux-${{ matrix.rpm_arch }}.rpm -C build_root usr/bin usr/share

      - name: Prepare Assets
        run: |
          mkdir -p dist
          cp al dist/
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            zip -r alwide-assets.zip assets/
          fi
          tar -czvf alwide-linux-${{ matrix.arch }}.tar.gz -C dist al

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            alwide-linux-${{ matrix.arch }}.tar.gz
            alwide-assets.zip
            alwide-${{ matrix.arch }}.AppImage
            alwide-linux-${{ matrix.deb_arch }}.deb
            alwide-linux-${{ matrix.rpm_arch }}.rpm
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
